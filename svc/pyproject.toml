[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maxmount-svc"
version = "0.1.0"
description = "Non-real-time services for the maxmount observatory control system"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyerfa>=2.0.1",          # ERFA (BSD-3-Clause): astrometry and time scales
    "sgp4>=2.23",             # Vallado's SGP4 (MIT)
    "pyyaml>=6",
    "eclipse-zenoh==1.10.2",  # must match mount-rt's zenoh-c
    "protobuf>=5.26",
    "grpcio-tools>=1.62",     # bundled protoc: generates maxmount.v1 code matching the runtime
    "aiohttp>=3.9",           # GUI gateway (HTTP + WebSocket)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui-test = ["playwright>=1.40"]  # browser smoke test; also run: playwright install chromium

[project.scripts]
mount-svc = "maxmount_svc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
