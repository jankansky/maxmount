<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maxmount</title>
<link rel="stylesheet" href="styles.css">
<script>
  // Apply the saved theme before first paint, so the red theme never flashes bright.
  try { document.documentElement.dataset.theme = localStorage.getItem('maxmount.theme') || 'dark'; } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
