# chrony: GNSS time from a USB receiver through gpsd (no PPS). Install as
# /etc/chrony/conf.d/maxmount-gps.conf next to Debian's default chrony.conf, which keeps its
# network pool. See deploy/README.md.
#
# Time over USB is labelled when gpsd reads the end of the receiver's message, so it lags the
# true second by a roughly fixed amount (tens of ms) with a few ms of jitter. `offset` removes
# the fixed part: measure it against the network servers once the receiver has a fix
# (deploy/README.md, "GPS time offset") and write the result here.
#
# `delay` makes the GPS's error estimate large, so chrony prefers network servers (about 1 ms)
# whenever they are reachable and falls back to the GPS offline, e.g. at a dark site. A GNSS
# receiver with PPS on a GPIO (deploy/pi/chrony.conf) is needed for the 10 us target.
refclock SHM 0 refid GPS poll 4 precision 1e-2 offset 0.000 delay 0.1
