# chrony configuration for a GNSS receiver (via gpsd shared memory) plus PPS on a GPIO.
# NMEA/UBX time labels each second; PPS provides the precise edge.

# Coarse time from gpsd (shared memory segment 0). Not selected on its own.
refclock SHM 0 refid GNSS precision 1e-1 offset 0.0 delay 0.2 noselect

# Precise second edges from the kernel PPS device, labelled by GNSS.
refclock PPS /dev/pps0 refid PPS lock GNSS prefer

# Optional network servers as a sanity check when online.
pool pool.ntp.org iburst maxsources 3

makestep 1 3
rtcsync
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
log tracking measurements statistics
