# Drive descriptor: Technosoft iPOS4808 BX-CAT.
# DRAFT: verify every entry against the drive's ESI file and firmware before use.
# Motor, feedback (sin/cos + Halls, dual-loop) and servo tuning are configured in
# EasyMotion Studio and stored in the drive; this file only covers the EtherCAT interface.
descriptor_version: 1
vendor: Technosoft
model: iPOS4808 BX-CAT
profile: cia402

identity:              # read with SOEM slaveinfo from "iPOS4808 BX-CAT v10", 2026-11-25
  vendor_id: 0x000001A3    # Technosoft
  product_code: 0x019F418D

modes: [csp]           # TODO: confirm firmware supports mode 8 (CSP)

sync:
  distributed_clocks: true   # confirmed: slaveinfo reports "Has DC: 1"

# The mapping below is written to the drive at PRE-OP -> SAFE-OP (0x1C12/0x1C13 assignment).
# Factory default seen on the reference drive (fw v10):
#   rx: 6040 controlword, 607A target position
#   tx: 6041 statusword, 6064 position, 6077 torque, 60F4 following error, 60FD digital inputs
pdo_mapping:
  configure: true
  rx_index: 0x1600
  tx_index: 0x1A00

rx_pdo:                # master -> drive
  - {index: 0x6040, sub: 0, type: u16, field: controlword}
  - {index: 0x6060, sub: 0, type: i8,  field: mode}
  - {index: 0x607A, sub: 0, type: i32, field: target_position}
  - {index: 0x60B1, sub: 0, type: i32, field: velocity_offset}   # TODO: confirm support
  - {index: 0x60B2, sub: 0, type: i16, field: torque_offset}     # TODO: confirm support

tx_pdo:                # drive -> master
  - {index: 0x6041, sub: 0, type: u16, field: statusword}
  - {index: 0x6061, sub: 0, type: i8,  field: mode_display}
  - {index: 0x6064, sub: 0, type: i32, field: position_actual}
  - {index: 0x606C, sub: 0, type: i32, field: velocity_actual}
  - {index: 0x6077, sub: 0, type: i16, field: torque_actual}
  - {index: 0x603F, sub: 0, type: u16, field: error_code}

capabilities:
  velocity_offset: unverified
  torque_offset: unverified

units:
  # TODO: iPOS velocity objects use internal units (position counts per slow-loop sample).
  # Record the slow-loop period here so velocity feedforward can be scaled correctly.
  velocity: internal

startup_sdo: []        # e.g. interpolation time period, following-error window
