# Fully simulated alt-az mount: runs anywhere, used for development and CI.
system: sim-altaz
kinematics: altaz_over_the_top

fieldbus:
  backend: sim
  cycle_us: 1000

realtime:
  cpu: -1
  priority: 80
  command_lead_us: 1000

# Observatory site (mount-svc): Mount Wilson, as an example for simulation.
site:
  latitude_deg: 34.2247
  longitude_deg: -118.0570
  height_m: 1742
  pressure_hpa: 830
  temperature_c: 10
  humidity: 0.3
  dut1_s: auto            # UT1-UTC from IERS Bulletin A (cached weekly), or seconds

# C8 imaging profiles (see the reference system): which camera is on the C8.
imaging:
  default: c8_zwo
  profiles:
    c8_zwo:
      name: "C8 + 0.63x corrector + ASI224MC"
      camera: ZWO ASI224MC
      camera_service: zwo
      pixel_um: 3.75
      sensor_px: [1304, 976]
      color: true
      focal_mm: 1350
    c8_d500:
      name: "C8 + 0.63x corrector + Nikon D500"
      camera: Nikon D500
      camera_service: dslr
      pixel_um: 4.22
      sensor_px: [5568, 3712]
      color: true
      focal_mm: 1350

# Widefield finder (`mount-svc widefield --sim`): Allied Vision GS1380 + 35 mm lens, as the reference system.
# The simulator draws catalogue stars where the mount REALLY points: the encoder angles through
# sim_model, the "true" pointing errors that a pointing run (GUI: Pointing model) should find.
cameras:
  widefield:
    backend: sim
    pixel_um: 6.45
    width: 1360
    height: 1024
    focal_mm: 35
    exposure_ms: 500
    sim_distortion_k1: 0.008  # a typical machine-vision lens: 0.8 % at the corners; solves fit it
    sim_rotation_deg: 12
    sim_model: {IA: 420, IE: -300, CA: 150, NPAE: 40, AN: 90, AW: -60, TF: 30}

pointing_run:
  settle_s: 1

tracking:
  horizon_min_el_deg: 10
  sun_min_sep_deg: 30
  slew_vel_deg_s: 10
  slew_acc_deg_s2: 10
  rate_margin: 0.9
  over_the_top_tolerance_deg: 1.0
  point_rate_hz: 20
  lookahead_s: 5

# Zenoh bridge (needs mount-rt built with -DMAXMOUNT_WITH_ZENOH=ON). Keys: maxmount/<site>/mount/...
zenoh:
  site: sim
  mode: peer              # peer, client or router
  connect: []             # e.g. ["tcp/192.168.1.10:7447"] to reach a router or the laptop
  listen: []
  multicast_scouting: true
  publish_raw: true       # every-cycle telemetry on mount/telemetry/raw

axes:
  - name: az
    drive: sim_cia402
    bus_position: 0
    counts_per_rev: 16777216
    limits: {min_deg: -270, max_deg: 270, max_vel_deg_s: 30, max_acc_deg_s2: 20, max_following_error_deg: 1.0}
  - name: el
    drive: sim_cia402
    bus_position: 1
    counts_per_rev: 16777216
    limits: {min_deg: -45, max_deg: 180, max_vel_deg_s: 10, max_acc_deg_s2: 10, max_following_error_deg: 1.0}
