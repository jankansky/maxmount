# SPDX-License-Identifier: GPL-3.0-or-later
# Reference system: custom alt-az mount, Raspberry Pi 4, two Technosoft iPOS4808 BX-CAT drives.
# DRAFT: limits below are placeholders until inertia, torque and cable wrap are measured.
#
# Per axis:
#   drive            descriptor in config/drives/<drive>.yaml
#   bus_position     0-based position on the EtherCAT segment (first drive after the Pi = 0)
#   counts_per_rev   drive position units per axis revolution; null until commissioned
#                    (monitor mode then shows raw counts and jogging is refused)
#   invert           true if positive drive counts move the axis the negative way
#   offset_deg       axis angle at drive position 0 (refined later by the pointing model)
#   limits           soft limits and rate limits enforced in mount-rt;
#                    max_following_error_deg quick-stops all axes (required for --jog).
#                    The measured error includes speed x ~3 ms of transport delay.
system: maxmount-reference
kinematics: altaz_over_the_top

fieldbus:
  backend: soem
  interface: eth0
  cycle_us: 1000

realtime:
  cpu: 3
  priority: 80
  command_lead_us: 1000

time:
  pps_device: /dev/pps0      # GNSS module with PPS on a GPIO pin
  max_clock_error_us: 10     # refuse satellite passes above this

# Observatory site (mount-svc). source: gpsd takes latitude, longitude and ellipsoidal height
# from the GNSS receiver (averaged, cached for when there is no fix). To set them by hand instead,
# remove `source` and give latitude_deg, longitude_deg (east positive) and height_m (WGS84).
site:
  source: gpsd
  gpsd_host: localhost
  pressure_hpa: 1013.25   # 0 disables refraction
  temperature_c: 10
  humidity: 0.5
  dut1_s: auto            # UT1-UTC from IERS Bulletin A (cached weekly), or seconds

# mount-svc tracking and safety settings.
tracking:
  horizon_min_el_deg: 10
  sun_min_sep_deg: 30
  slew_vel_deg_s: 5
  slew_acc_deg_s2: 5
  rate_margin: 0.9                 # plans use at most this fraction of the axis limits
  over_the_top_tolerance_deg: 1.0  # widefield acquisition: raise; C8 narrow field: lower
  point_rate_hz: 20
  lookahead_s: 5

# C8 imaging profiles: the telescope + reducer/Barlow + camera combinations in use (the ZWO or
# the D500 is on the C8; the widefield GigE finder has its own lens). The GUI header switches
# the active one (remembered on the Pi); it picks the Track screen's C8 camera panel
# (camera_service) and sets pixel counts, the passes size filter, and later the camera
# service's sampling and processing windows.
# focal_mm: replace with the plate-solved value. C8 aperture 203.2 mm; diffraction limit
# lambda/D = 0.56" at 550 nm, so Nyquist sampling needs pixels <= 0.28" (0.35" at 685 nm IR).
imaging:
  default: deep_sky_224
  profiles:
    deep_sky_224:
      name: "C8 + 0.63x Corrector IV + ASI224MC"
      camera: ZWO ASI224MC            # IMX224 colour, 3.75 um, 1304 x 976, fast ROI
      camera_service: zwo             # which camera service drives the C8 panel on the Track screen
      pixel_um: 3.75
      sensor_px: [1304, 976]
      color: true
      focal_mm: 1350                  # 1260-1450 depending on spacing
      note: "0.57\"/px, 12.5' x 9.3': acquisition and seeing-limited imaging; 2x coarser than Nyquist"
    high_res_224:
      name: "C8 native f/10 + ASI224MC"
      camera: ZWO ASI224MC
      camera_service: zwo
      pixel_um: 3.75
      sensor_px: [1304, 976]
      color: true
      focal_mm: 2032
      note: "0.38\"/px, 8.3' x 6.2': planets and LEO lucky imaging; with an IR-pass filter every pixel responds alike, near Nyquist at 685 nm"
    high_res_224_barlow:
      name: "C8 + 1.5x Barlow (f/15) + ASI224MC"
      camera: ZWO ASI224MC
      camera_service: zwo
      pixel_um: 3.75
      sensor_px: [1304, 976]
      color: true
      focal_mm: 3048
      note: "0.25\"/px, 5.5' x 4.1': Nyquist in visible light, colour; small field needs the camera loop to acquire LEO targets"
    deep_sky_d500:
      name: "C8 + 0.63x Corrector IV + Nikon D500"
      camera: Nikon D500              # APS-C, 4.22 um, 5568 x 3712, not astro-modified
      camera_service: dslr            # mount-svc dslr
      pixel_um: 4.22
      sensor_px: [5568, 3712]
      color: true
      focal_mm: 1350
      note: "0.65\"/px, 60' x 40' (corners beyond the 27 mm image circle vignette): deep-sky and satellite stills; no ROI streaming for tracking"
    high_res_d500:
      name: "C8 native f/10 + Nikon D500"
      camera: Nikon D500
      camera_service: dslr
      pixel_um: 4.22
      sensor_px: [5568, 3712]
      color: true
      focal_mm: 2032
      note: "0.43\"/px, 40' x 26': satellite and lunar stills at high resolution"

# Cameras. dslr: a stills camera over USB through libgphoto2 (`mount-svc dslr`; the Nikon D500).
cameras:
  dslr:
    backend: gphoto2          # or sim: a synthetic star field, no camera needed
    data_dir: ~/maxmount-data # captures saved on the Pi go to <data_dir>/dslr/<date>/
    liveview_fps: 8
    save_to: card             # card | pi | both; changeable in the GUI
  # zwo: the ZWO camera on the C8 (`mount-svc zwo`), through ZWO's ASI SDK. Download the
  # "ASI Camera SDK" for Linux from ZWO's developer page, copy lib/armv8/libASICamera2.so here,
  # and install its udev rules (lib/asi.rules) so the camera is usable without root.
  zwo:
    backend: sdk              # or sim: a simulated ASI224MC
    sdk_lib: /usr/local/lib/libASICamera2.so
    data_dir: ~/maxmount-data # frames (FITS) and videos (SER) go to <data_dir>/zwo/<date>/
    liveview_fps: 8           # previews to the GUI; the camera itself streams faster
    record_buffer_mb: 512     # SER recording: frames held in RAM while the SD card catches up
    record_min_free_mb: 2048  # recording stops when the disk has less free space than this
    roi_latency_frames: 2     # ROI tracking: frames still read at the old ROI position after a move
                              # (to be measured on the real camera)
  # widefield: the GigE finder camera with its own lens (`mount-svc widefield`), through Aravis
  # (apt install gir1.2-aravis-0.8 python3-gi; arv-tool-0.8 lists cameras). It plate-solves
  # for the pointing model. Allied Vision Prosilica GS1380: Sony ICX285 CCD, mono, global shutter
  # (one exposure time for the whole frame), 1360 x 1024, 6.45 um; Mono8 / Mono12 over GigE Vision.
  # With a 35 mm C-mount lens: 14.3 x 10.8 deg, 38"/px, ~150 catalogue stars (mag <= 8) in the
  # field (~50 near the galactic poles).
  widefield:
    backend: aravis           # or sim: catalogue stars where the mount really points
    camera: ""                # Aravis device id from arv-tool-0.8, e.g. "Allied Vision Technologies-<serial>"; "" = first found
    data_dir: ~/maxmount-data # frames go to <data_dir>/widefield/<date>/, solves to <data_dir>/widefield/solves.jsonl
    liveview_fps: 2
    pixel_um: 6.45
    width: 1360
    height: 1024
    focal_mm: 35              # nominal; the solver allows +-12 %: put the solved value here (arcsec/px = 206.265 * pixel_um / focal_mm)
    distortion_k1: 0          # radial distortion at the corners (0.01 = 1 %): every solve fits it and reports it; put the typical value here
    latency_ms: 0             # frame arrival after the exposure ends (readout + transfer, ~tens of ms): to measure
    exposure_ms: 500
    gain: 10                  # dB
    packet_size: 0            # GigE packet size; 0 = negotiate (8192+ with jumbo frames on eth1)
    solver: builtin           # builtin (numpy, catalogue to mag 8) | astap (astap_cli + a star database)
    astap_path: astap_cli
    search_radius_deg: 5      # how far from the mount's position a solve looks

# Pointing model runs (mount-svc serve; the GUI's Pointing model screen): slew to points over
# the sky, plate-solve the widefield camera at each, fit pointing.py's terms.
pointing_run:
  camera: widefield
  settle_s: 2
  min_el_deg: 0               # 0 = horizon mask + 5 deg
  max_el_deg: 80              # keep out of the zenith keyhole
  solve_timeout_s: 60
  moon_min_sep_deg: 15

# Camera loop (mount-svc serve): the narrow-field camera's ROI-tracking centroids
# (camera/<camera>/centroid) become tracking corrections: time and cross-track offsets for
# satellites, axis offsets for other targets. Turned on in the GUI (Corrections: Auto).
# The geometry below is the starting guess; Calibrate in the GUI measures the real one (two
# small axis moves while the target is locked) and keeps it in ~/.local/state/maxmount/.
closed_loop:
  camera: zwo
  rotation_deg: 0           # sensor +x from the +azimuth direction, towards +elevation
  flip: false               # true if the image is mirrored
  arcsec_per_px: 0          # 0 = from the imaging profile whose camera_service is the camera
  gain: 0.5                 # fraction of the measured error corrected per update
  settle_s: 0.6             # wait after a correction before measuring again
  avg_s: 0.25               # centroids averaged per update
  max_step_arcsec: 120      # largest single correction
  max_total_arcsec: 600     # the loop opens if its corrections add up to more (locked on the wrong object?)
  max_step_px: 20           # largest image move per correction (the ROI tracker must not lose the target)
  calibrate_step_arcsec: 0  # the calibration's axis moves; 0 = max_step_px on the sensor

# ADS-B aircraft positions (Passes screen, Aircraft tab; track_aircraft) from a local
# 1090 MHz receiver: readsb or dump1090 writing aircraft.json. Nothing is fetched from the internet.
adsb:
  source: /run/readsb/aircraft.json   # or http://<host>/tar1090/data/aircraft.json on the LAN
  max_age_s: 10                       # hold the mount if the tracked aircraft's position is older
  max_track_s: 600

# Zenoh bridge (needs mount-rt built with -DMAXMOUNT_WITH_ZENOH=ON). Keys: maxmount/<site>/mount/...
zenoh:
  site: lab
  mode: peer              # peer, client or router
  connect: []             # e.g. ["tcp/192.168.1.10:7447"] to reach a router or the laptop
  listen: []
  multicast_scouting: true
  publish_raw: true       # every-cycle telemetry on mount/telemetry/raw

axes:
  - name: az
    drive: technosoft_ipos4808_bx_cat
    bus_position: 0
    mechanics: Aerotech ADRT-150-115 direct drive, sin/cos encoder + Halls
    counts_per_rev: null     # TODO: encoder line count x drive interpolation
    invert: false
    offset_deg: 0
    limits:                  # cable wrap set by through-axis USB and Ethernet cables
      min_deg: -270
      max_deg: 270
      max_vel_deg_s: 30
      max_acc_deg_s2: 20
      max_following_error_deg: 1.0

  - name: el
    drive: technosoft_ipos4808_bx_cat
    bus_position: 1
    mechanics: Teknic Hudson M-2321P + Bell-Everman ServoBelt; Renishaw RGH41 + REE2000 load encoder (dual loop)
    counts_per_rev: null     # TODO: 2*pi*r / (tape pitch / interpolation)
    invert: false
    offset_deg: 0
    limits:
      min_deg: -45           # mechanical; the horizon mask limits observing
      max_deg: 180           # through zenith to the opposite horizon
      max_vel_deg_s: 10
      max_acc_deg_s2: 10
      max_following_error_deg: 1.0

# Camera hardware (settings are under `cameras:` above): widefield GigE finder on the
# USB-Ethernet adapter; narrow field ZWO on USB 3 at the C8.
