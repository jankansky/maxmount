// Camera services (Zenoh keys maxmount/<site>/camera/<id>/...; id "dslr" for the Nikon D500,
// "zwo" for the ZWO camera on the C8):
//   camera/<id>/status   CameraStatus, about once a second and on every change
//   camera/<id>/frame    CameraFrame: live view frames, and the preview of each capture
//   camera/<id>/cmd      queryable: CameraCommand -> CameraReply
syntax = "proto3";

package maxmount.v1;

// One camera setting with its current value and the values the camera offers.
message CameraSetting {
  string name = 1;              // dslr: iso | shutterspeed | imagequality | capturetarget
                                // zwo: exposure_ms | gain | offset | image_type | bin | roi | bandwidth
  string label = 2;
  string value = 3;
  repeated string choices = 4;  // empty for a numeric setting
  bool read_only = 5;
  bool numeric = 6;             // a number within [min, max] in steps of step
  double min = 7;
  double max = 8;
  double step = 9;
  string unit = 10;
}

message CameraStatus {
  int64 t_ns = 1;
  string camera_id = 2;
  bool connected = 3;
  string model = 4;
  string state = 5;             // disconnected | idle | liveview | exposing | downloading | error
  string message = 6;           // last event or error
  int32 battery_percent = 7;    // -1 unknown
  repeated CameraSetting settings = 8;
  bool liveview = 9;
  int32 captures = 10;          // since the service started
  double exposure_s = 11;       // the exposure in progress
  int64 exposure_end_ns = 12;
  string save_to = 13;          // card | pi | both
  string data_dir = 14;
  bool simulated = 15;
  bool stretch = 16;            // previews are auto-stretched
  bool bulb_supported = 17;
  // Video cameras (zwo).
  double fps = 18;              // frames per second delivered by the camera (live view)
  int64 dropped = 19;           // frames dropped by the camera or driver since video started
  double temperature_c = 20;    // sensor temperature; NaN if unknown
  repeated int32 roi = 21;      // x, y, width, height in binned pixels
  int32 sensor_width = 22;
  int32 sensor_height = 23;
  repeated string storage = 24; // where captures can go: card, pi, both
  // SER video recording (zwo): the recording in progress, or the last one.
  bool recording = 25;
  string record_file = 26;      // on the Pi
  int64 record_frames = 27;     // written to the file
  int64 record_dropped = 28;    // not recorded because the disk fell behind (the camera's own drops are in dropped)
  double record_elapsed_s = 29;
  int64 record_bytes = 30;
  int64 record_queued = 31;     // frames waiting in RAM for the disk
  int64 record_pool = 32;       // frames the RAM buffer holds
  int64 disk_free_bytes = 33;
  double record_max_s = 34;     // 0: no time limit
  int64 record_max_frames = 35; // 0: no frame limit
  bool records_video = 36;      // the camera can record video
}

message SetCameraSetting {
  string name = 1;
  string value = 2;
}

message Capture {
  double bulb_s = 1;            // > 0: a bulb exposure timed by the service; 0: the camera's shutter speed
}

// Start or stop recording the video stream to a SER file on the Pi. Starting turns video on.
message Record {
  bool on = 1;
  double duration_s = 2;        // 0: until stopped (or the disk is nearly full)
  int32 max_frames = 3;         // 0: no limit
}

message CameraCommand {
  oneof command {
    SetCameraSetting set = 1;
    Capture capture = 2;
    bool liveview = 3;
    string save_to = 4;         // card | pi | both
    bool stretch = 5;
    bool abort = 6;             // end a bulb exposure early
    Record record = 7;
  }
}

message CameraReply {
  bool ok = 1;
  string message = 2;
}

message CameraFrame {
  int64 t_ns = 1;
  string camera_id = 2;
  string kind = 3;              // liveview | capture
  bytes jpeg = 4;
  int32 width = 5;
  int32 height = 6;
  bool stretched = 7;
  // Statistics of the frame before stretching (8-bit luminance).
  repeated uint32 histogram = 8;  // 64 bins
  double median = 9;
  double p99 = 10;
  double saturated_frac = 11;
  // Captures only.
  repeated string files = 12;   // saved on the Pi, or "card:<folder>/<name>"
  double exposure_s = 13;
  string iso = 14;
  string shutter = 15;
  double gain = 16;             // zwo
  int32 bit_depth = 17;         // of the saved data
}
