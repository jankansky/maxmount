// SPDX-License-Identifier: GPL-3.0-or-later
// Camera services (Zenoh keys maxmount/<site>/camera/<id>/...; id "dslr" for the Nikon D500,
// "zwo" for the ZWO camera on the C8, "widefield" for the GigE finder camera):
//   camera/<id>/status   CameraStatus, about once a second and on every change
//   camera/<id>/frame    CameraFrame: live view frames, and the preview of each capture
//   camera/<id>/cmd      queryable: CameraCommand -> CameraReply
//   camera/<id>/centroid CameraCentroid: the tracked target in each frame (ROI tracking on)
syntax = "proto3";

package maxmount.v1;

// One camera setting with its current value and the values the camera offers.
message CameraSetting {
  string name = 1;              // dslr: iso | shutterspeed | imagequality | capturetarget
                                // zwo: exposure_ms | gain | offset | image_type | bin | roi | bandwidth
  string label = 2;
  string value = 3;
  repeated string choices = 4;  // empty for a numeric setting
  bool read_only = 5;
  bool numeric = 6;             // a number within [min, max] in steps of step
  double min = 7;
  double max = 8;
  double step = 9;
  string unit = 10;
}

message CameraStatus {
  int64 t_ns = 1;
  string camera_id = 2;
  bool connected = 3;
  string model = 4;
  string state = 5;             // disconnected | idle | liveview | exposing | downloading | error
  string message = 6;           // last event or error
  int32 battery_percent = 7;    // -1 unknown
  repeated CameraSetting settings = 8;
  bool liveview = 9;
  int32 captures = 10;          // since the service started
  double exposure_s = 11;       // the exposure in progress
  int64 exposure_end_ns = 12;
  string save_to = 13;          // card | pi | both
  string data_dir = 14;
  bool simulated = 15;
  bool stretch = 16;            // previews are auto-stretched
  bool bulb_supported = 17;
  // Video cameras (zwo).
  double fps = 18;              // frames per second delivered by the camera (live view)
  int64 dropped = 19;           // frames dropped by the camera or driver since video started
  double temperature_c = 20;    // sensor temperature; NaN if unknown
  repeated int32 roi = 21;      // x, y, width, height in binned pixels
  int32 sensor_width = 22;
  int32 sensor_height = 23;
  repeated string storage = 24; // where captures can go: card, pi, both
  // SER video recording (zwo): the recording in progress, or the last one.
  bool recording = 25;
  string record_file = 26;      // on the Pi
  int64 record_frames = 27;     // written to the file
  int64 record_dropped = 28;    // not recorded because the disk fell behind (the camera's own drops are in dropped)
  double record_elapsed_s = 29;
  int64 record_bytes = 30;
  int64 record_queued = 31;     // frames waiting in RAM for the disk
  int64 record_pool = 32;       // frames the RAM buffer holds
  int64 disk_free_bytes = 33;
  double record_max_s = 34;     // 0: no time limit
  int64 record_max_frames = 35; // 0: no frame limit
  bool records_video = 36;      // the camera can record video
  bool record_stopping = 37;    // stopped; still writing the frames queued in RAM
  // ROI tracking (zwo): the ROI follows the target across the sensor.
  bool roi_tracking = 38;
  string track_state = 39;      // off | acquiring | locked | lost
  double track_x = 40;          // the target in the ROI, binned px (NaN if not found)
  double track_y = 41;
  double track_err_x = 42;      // from the ROI centre, binned px
  double track_err_y = 43;
  double track_snr = 44;
  double track_speed = 45;      // across the sensor, binned px/s
  int64 roi_moves = 46;
  bool roi_centered = 47;       // the ROI is at the sensor's centre (not moved by tracking)
  // Plate solving (widefield): the last solve, and the camera's field.
  PlateSolution solution = 48;
  double fov_w_deg = 49;
  double fov_h_deg = 50;
  double arcsec_per_px = 51;     // configured (a solve measures it: solution.arcsec_per_px)
  bool solving = 52;
}

// Where a frame points on the sky, from a plate solve, and where the mount believed it pointed.
message PlateSolution {
  int64 t_ns = 1;               // mid-exposure, UTC
  bool ok = 2;
  string message = 3;
  double ra_deg = 4;            // ICRS J2000, the image centre
  double dec_deg = 5;
  double roll_deg = 6;          // position angle of the image's up direction, N through E
  double arcsec_per_px = 7;
  bool mirrored = 8;
  int32 stars = 9;              // detected
  int32 matched = 10;
  double rms_arcsec = 11;
  double solve_s = 12;
  string solver = 13;           // builtin | astap
  bool has_mount = 14;          // mount telemetry at mid-exposure was available
  double enc_az_deg = 15;       // encoder (actual) axis angles at mid-exposure, mechanical
  double enc_el_deg = 16;
  double cmd_az_deg = 17;       // commanded axis angles then
  double cmd_el_deg = 18;
  double az_deg = 19;           // the solved centre, observed (refracted) az/el
  double el_deg = 20;
  double mount_az_deg = 21;     // where the mount believed it pointed: encoders through the active pointing model
  double mount_el_deg = 22;
  double mount_ra_deg = 23;
  double mount_dec_deg = 24;
  double err_xel_arcsec = 25;   // solved minus believed, on the sky (az * cos el, el)
  double err_el_arcsec = 26;
  double exposure_s = 27;
  double temperature_c = 28;    // site conditions used for refraction
  double pressure_hpa = 29;
  string id = 30;               // the Solve request's id
}

// Plate-solve the next frame (widefield): the reply comes at once, the result in the status
// (solution, with the request's id). search_radius_deg: how far from the mount's position to
// look (0: configured).
message Solve {
  double search_radius_deg = 1;
  string id = 2;
}

message SetCameraSetting {
  string name = 1;
  string value = 2;
}

message Capture {
  double bulb_s = 1;            // > 0: a bulb exposure timed by the service; 0: the camera's shutter speed
}

// Start or stop recording the video stream to a SER file on the Pi. Starting turns video on.
message Record {
  bool on = 1;
  double duration_s = 2;        // 0: until stopped (or the disk is nearly full)
  int32 max_frames = 3;         // 0: no limit
}

// ROI tracking: on acquires the brightest object in the ROI, or the one nearest (pick_x,
// pick_y) when has_pick (fractions of the ROI's width and height from its top-left);
// recenter moves the ROI back to the sensor's centre.
message RoiTrack {
  bool on = 1;
  bool has_pick = 2;
  double pick_x = 3;
  double pick_y = 4;
  bool recenter = 5;
}

message CameraCommand {
  oneof command {
    SetCameraSetting set = 1;
    Capture capture = 2;
    bool liveview = 3;
    string save_to = 4;         // card | pi | both
    bool stretch = 5;
    bool abort = 6;             // end a bulb exposure early
    Record record = 7;
    RoiTrack roi_track = 8;
    Solve solve = 9;
  }
}

message CameraReply {
  bool ok = 1;
  string message = 2;
}

message CameraFrame {
  int64 t_ns = 1;
  string camera_id = 2;
  string kind = 3;              // liveview | capture
  bytes jpeg = 4;
  int32 width = 5;
  int32 height = 6;
  bool stretched = 7;
  // Statistics of the frame before stretching (8-bit luminance).
  repeated uint32 histogram = 8;  // 64 bins
  double median = 9;
  double p99 = 10;
  double saturated_frac = 11;
  // Captures only.
  repeated string files = 12;   // saved on the Pi, or "card:<folder>/<name>"
  double exposure_s = 13;
  string iso = 14;
  string shutter = 15;
  double gain = 16;             // zwo
  int32 bit_depth = 17;         // of the saved data
  // Live view of a video camera: the ROI this frame was read with (x, y, w, h, binned
  // sensor px) and the tracked target in it (frame px; NaN if none).
  repeated int32 roi = 18;
  string track_state = 19;
  double track_x = 20;
  double track_y = 21;
}

// The tracked target in one frame. Positions in binned sensor pixels from the sensor's
// top-left (x right, y down, 0 = the centre of the first pixel); dx, dy from the sensor's
// centre (the camera's boresight, for pointing corrections).
message CameraCentroid {
  int64 t_ns = 1;               // mid-exposure, UTC (approximate: frame arrival minus half the exposure)
  string camera_id = 2;
  string state = 3;             // locked | acquiring
  double x = 4;
  double y = 5;
  double dx = 6;
  double dy = 7;
  repeated int32 roi = 8;       // x, y, w, h
  int32 bin = 9;
  double flux = 10;
  double snr = 11;
  double vx = 12;               // filtered velocity, binned px/s
  double vy = 13;
  double pixel_um = 14;         // binned pixel size
}
